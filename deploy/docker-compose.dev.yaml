services:
  postgres:
    image: postgres:16
    container_name: auth_postgres
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  file_postgres:
    image: postgres:16
    container_name: file_postgres
    environment:
      POSTGRES_USER: file_user
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: file_db
    ports:
      - "5433:5432"
    volumes:
      - file_postgres_data:/var/lib/postgresql/data
  acl_postgres:
    image: postgres:16
    container_name: acl_postgres
    environment:
      POSTGRES_USER: acl_user
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: acl_db
    ports:
      - "5434:5432"
    volumes:
      - acl_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: auth_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: auth_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: auth_user
      RABBITMQ_DEFAULT_PASS: supersecret
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  minio:
    image: minio/minio:latest
    container_name: file_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  kong:
    image: kong:3.6
    container_name: pawly_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong/kong.yml:/opt/kong/kong.yml:ro

volumes:
  postgres_data:
  file_postgres_data:
  acl_postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
