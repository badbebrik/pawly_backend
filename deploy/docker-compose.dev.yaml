x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    container_name: auth_postgres
    logging: *default-logging
    env_file:
      - ../services/auth/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  file_postgres:
    image: postgres:16
    container_name: file_postgres
    logging: *default-logging
    env_file:
      - ../services/file/.env
    volumes:
      - file_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file_user -d file_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  acl_postgres:
    image: postgres:16
    container_name: acl_postgres
    logging: *default-logging
    env_file:
      - ../services/acl/.env
    volumes:
      - acl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acl_user -d acl_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  profile_postgres:
    image: postgres:16
    container_name: profile_postgres
    logging: *default-logging
    env_file:
      - ../services/profile/.env
    volumes:
      - profile_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_user -d profile_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  pet_postgres:
    image: postgres:16
    container_name: pet_postgres
    logging: *default-logging
    env_file:
      - ../services/pet/.env
    volumes:
      - pet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet_user -d pet_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  health_postgres:
    image: postgres:16
    container_name: health_postgres
    logging: *default-logging
    env_file:
      - ../services/health/.env
    ports:
      - "5437:5432"
    volumes:
      - health_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_user -d health_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  push_postgres:
    image: postgres:16
    container_name: push_postgres
    logging: *default-logging
    env_file:
      - ../services/push/.env
    volumes:
      - push_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U push_user -d push_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  chat_postgres:
    image: postgres:16
    container_name: chat_postgres
    logging: *default-logging
    env_file:
      - ../services/chat/.env
    ports:
      - "5439:5432"
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  chat_redis:
    image: redis:7-alpine
    container_name: chat_redis
    logging: *default-logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: auth_redis
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: auth_rabbitmq
    logging: *default-logging
    env_file:
      - ./env/rabbitmq.dev.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  file:
    build:
      context: ../services
      dockerfile: file/Dockerfile
    container_name: pawly_file
    logging: *default-logging
    env_file:
      - ../services/file/.env
    depends_on:
      file_postgres:
        condition: service_healthy

  acl:
    build:
      context: ../services
      dockerfile: acl/Dockerfile
    container_name: pawly_acl
    logging: *default-logging
    env_file:
      - ../services/acl/.env
      - ./env/acl.dev.env
    depends_on:
      acl_postgres:
        condition: service_healthy
      profile:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8087/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  profile:
    build:
      context: ../services
      dockerfile: profile/Dockerfile
    container_name: pawly_profile
    logging: *default-logging
    env_file:
      - ../services/profile/.env
      - ./env/profile.dev.env
    depends_on:
      profile_postgres:
        condition: service_healthy
      file:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8086/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  auth:
    build:
      context: ../services
      dockerfile: auth/Dockerfile
    container_name: pawly_auth
    logging: *default-logging
    env_file:
      - ../services/auth/.env
      - ./env/auth.dev.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      profile:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  chat:
    build:
      context: ..
      dockerfile: services/chat/Dockerfile
    container_name: pawly_chat
    logging: *default-logging
    env_file:
      - ../services/chat/.env
      - ./env/chat.dev.env
    depends_on:
      chat_postgres:
        condition: service_healthy
      chat_redis:
        condition: service_healthy
      acl:
        condition: service_started
      profile:
        condition: service_started
      pet:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8089/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  email:
    build:
      context: ../services
      dockerfile: email/Dockerfile
    container_name: pawly_email
    logging: *default-logging
    env_file:
      - ../services/email/.env
      - ./env/email.dev.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8084/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  pet:
    build:
      context: ../services
      dockerfile: pet/Dockerfile
    container_name: pawly_pet
    logging: *default-logging
    env_file:
      - ../services/pet/.env
      - ./env/pet.dev.env
    depends_on:
      pet_postgres:
        condition: service_healthy
      acl:
        condition: service_started
      file:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8085/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  health:
    build:
      context: ../services
      dockerfile: health/Dockerfile
    container_name: pawly_health
    logging: *default-logging
    env_file:
      - ../services/health/.env
      - ./env/health.dev.env
    depends_on:
      health_postgres:
        condition: service_healthy
      acl:
        condition: service_started
      file:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8088/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  push:
    build:
      context: ../services
      dockerfile: push/Dockerfile
    container_name: pawly_push
    logging: *default-logging
    env_file:
      - ../services/push/.env
      - ./env/push.dev.env
    volumes:
      - ./secrets/pawly-6e5c5-60de53ef1b33.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      push_postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8090/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  kong:
    image: kong:3.6
    container_name: pawly_kong
    logging: *default-logging
    env_file:
      - ./env/kong.dev.env
    ports:
      - "8000:8000"
    volumes:
      - ./kong/kong.yml:/opt/kong/kong.yml:ro
    depends_on:
      auth:
        condition: service_started
      profile:
        condition: service_started
      acl:
        condition: service_started
      pet:
        condition: service_started
      health:
        condition: service_started
      push:
        condition: service_started
      chat:
        condition: service_started
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: deploy/migrate/Dockerfile
    profiles:
      - tools
    logging: *default-logging
    volumes:
      - ..:/work:ro
    depends_on:
      postgres:
        condition: service_healthy
      file_postgres:
        condition: service_healthy
      acl_postgres:
        condition: service_healthy
      profile_postgres:
        condition: service_healthy
      pet_postgres:
        condition: service_healthy
      health_postgres:
        condition: service_healthy
      push_postgres:
        condition: service_healthy
      chat_postgres:
        condition: service_healthy

volumes:
  postgres_data:
  file_postgres_data:
  acl_postgres_data:
  profile_postgres_data:
  pet_postgres_data:
  health_postgres_data:
  push_postgres_data:
  chat_postgres_data:
  redis_data:
  rabbitmq_data:
