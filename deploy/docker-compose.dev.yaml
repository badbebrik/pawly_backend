services:
  postgres:
    image: postgres:16
    container_name: auth_postgres
    env_file:
      - ../services/auth/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  file_postgres:
    image: postgres:16
    container_name: file_postgres
    env_file:
      - ../services/file/.env
    volumes:
      - file_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file_user -d file_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  acl_postgres:
    image: postgres:16
    container_name: acl_postgres
    env_file:
      - ../services/acl/.env
    volumes:
      - acl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acl_user -d acl_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  profile_postgres:
    image: postgres:16
    container_name: profile_postgres
    env_file:
      - ../services/profile/.env
    volumes:
      - profile_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_user -d profile_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  pet_postgres:
    image: postgres:16
    container_name: pet_postgres
    env_file:
      - ../services/pet/.env
    volumes:
      - pet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet_user -d pet_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  health_postgres:
    image: postgres:16
    container_name: health_postgres
    env_file:
      - ../services/health/.env
    volumes:
      - health_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_user -d health_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  push_postgres:
    image: postgres:16
    container_name: push_postgres
    env_file:
      - ../services/push/.env
    volumes:
      - push_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U push_user -d push_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  chat_postgres:
    image: postgres:16
    container_name: chat_postgres
    env_file:
      - ../services/chat/.env.docker
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  chat_redis:
    image: redis:7-alpine
    container_name: chat_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: auth_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: auth_rabbitmq
    env_file:
      - ./env/rabbitmq.dev.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  file:
    build:
      context: ../services
      dockerfile: file/Dockerfile
    container_name: pawly_file
    restart: unless-stopped
    env_file:
      - ../services/file/.env
    depends_on:
      file_postgres:
        condition: service_healthy

  acl:
    build:
      context: ../services
      dockerfile: acl/Dockerfile
    container_name: pawly_acl
    restart: unless-stopped
    env_file:
      - ../services/acl/.env
    environment:
      POSTGRES_HOST: acl_postgres
      POSTGRES_PORT: "5432"
      PROFILE_SERVICE_GRPC_ADDR: profile:50058
    depends_on:
      acl_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8087/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  profile:
    build:
      context: ../services
      dockerfile: profile/Dockerfile
    container_name: pawly_profile
    restart: unless-stopped
    env_file:
      - ../services/profile/.env
    environment:
      POSTGRES_HOST: profile_postgres
      POSTGRES_PORT: "5432"
      FILE_SERVICE_GRPC_ADDR: file:50056
    depends_on:
      profile_postgres:
        condition: service_healthy
      file:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8086/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  auth:
    build:
      context: ../services
      dockerfile: auth/Dockerfile
    container_name: pawly_auth
    restart: unless-stopped
    env_file:
      - ../services/auth/.env
    environment:
      APP_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: auth_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      JWT_SECRET: local_dev_jwt_secret
      JWT_ISSUER: pawly
      ACCESS_TOKEN_TTL_MINUTES: "15"
      REFRESH_TOKEN_TTL_DAYS: "30"
      OUTBOX_WORKER_INTERVAL_MS: "2000"
      OUTBOX_WORKER_BATCH_SIZE: "100"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: auth_user
      RABBITMQ_PASSWORD: supersecret
      RABBITMQ_NOTIFICATIONS_QUEUE: notifications.events
      PROFILE_SERVICE_GRPC_ADDR: profile:50058
      OAUTH_HTTP_TIMEOUT_SECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      profile:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  notification:
    build:
      context: ../services/notification
    container_name: pawly_notification
    restart: unless-stopped
    env_file:
      - ../services/notification/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8083/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  chat:
    build:
      context: ..
      dockerfile: services/chat/Dockerfile
    container_name: pawly_chat
    restart: unless-stopped
    env_file:
      - ../services/chat/.env.docker
    depends_on:
      chat_postgres:
        condition: service_healthy
      chat_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8089/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  email:
    build:
      context: ../services/email
    container_name: pawly_email
    restart: unless-stopped
    env_file:
      - ../services/email/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      TEMPLATE_DIR: /app/templates
      REQUEUE_ON_FAIL: "false"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8084/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  pet:
    build:
      context: ../services
      dockerfile: pet/Dockerfile
    container_name: pawly_pet
    restart: unless-stopped
    env_file:
      - ../services/pet/.env
    environment:
      POSTGRES_HOST: pet_postgres
      POSTGRES_PORT: "5432"
      ACL_GRPC_ADDR: acl:50057
      FILE_GRPC_ADDR: file:50056
    depends_on:
      pet_postgres:
        condition: service_healthy
      acl:
        condition: service_started
      file:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8085/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  health:
    build:
      context: ../services
      dockerfile: health/Dockerfile
    container_name: pawly_health
    restart: unless-stopped
    env_file:
      - ../services/health/.env
    environment:
      POSTGRES_HOST: health_postgres
      POSTGRES_PORT: "5432"
      ACL_GRPC_ADDR: acl:50057
      ACL_HTTP_BASE_URL: http://acl:8087
      FILE_GRPC_ADDR: file:50056
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      SCHEDULED_DISPATCH_INTERVAL_SEC: "60"
      SCHEDULED_DISPATCH_BATCH_SIZE: "100"
    depends_on:
      health_postgres:
        condition: service_healthy
      acl:
        condition: service_started
      file:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8088/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  push:
    build:
      context: ../services
      dockerfile: push/Dockerfile
    container_name: pawly_push
    restart: unless-stopped
    env_file:
      - ../services/push/.env
    volumes:
      - ./secrets/pawly-6e5c5-60de53ef1b33.json:/run/secrets/firebase-service-account.json:ro
    environment:
      POSTGRES_HOST: push_postgres
      POSTGRES_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      FCM_CREDENTIALS_FILE: /run/secrets/firebase-service-account.json
    depends_on:
      push_postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8090/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  kong:
    image: kong:3.6
    container_name: pawly_kong
    env_file:
      - ./env/kong.dev.env
    ports:
      - "8000:8000"
    volumes:
      - ./kong/kong.yml:/opt/kong/kong.yml:ro
    depends_on:
      auth:
        condition: service_healthy
      profile:
        condition: service_healthy
      acl:
        condition: service_healthy
      pet:
        condition: service_healthy
      health:
        condition: service_healthy
      notification:
        condition: service_healthy
      push:
        condition: service_healthy

  migrate:
    build:
      context: ..
      dockerfile: deploy/migrate/Dockerfile
    profiles:
      - tools
    volumes:
      - ..:/work:ro
    depends_on:
      postgres:
        condition: service_healthy
      file_postgres:
        condition: service_healthy
      acl_postgres:
        condition: service_healthy
      profile_postgres:
        condition: service_healthy
      pet_postgres:
        condition: service_healthy
      health_postgres:
        condition: service_healthy
      push_postgres:
        condition: service_healthy
      chat_postgres:
        condition: service_healthy

volumes:
  postgres_data:
  file_postgres_data:
  acl_postgres_data:
  profile_postgres_data:
  pet_postgres_data:
  health_postgres_data:
  push_postgres_data:
  chat_postgres_data:
  redis_data:
  rabbitmq_data:
