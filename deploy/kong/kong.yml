_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth:8080
    routes:
      - name: auth-public-routes
        paths:
          - ~/auth/register/email$
          - ~/auth/verification/email/resend$
          - ~/auth/verify/email$
          - ~/auth/login/email$
          - ~/auth/login/oauth$
          - ~/auth/refresh$
          - ~/auth/password/reset/request$
          - ~/auth/password/reset/verify$
          - ~/auth/password/reset/confirm$
        strip_path: false
      - name: auth-protected-routes
        paths:
          - ~/auth/logout$
          - ~/auth/logout-all$
          - ~/auth/password/change$
        strip_path: false

  - name: profile-service
    url: http://profile:8086
    routes:
      - name: profile-routes
        paths:
          - /v1/profile
        strip_path: false

  - name: acl-service
    url: http://acl:8087
    routes:
      - name: acl-routes
        paths:
          - /v1/acl
          - ~/v1/pets/.+/acl
        strip_path: false

  - name: pet-service
    url: http://pet:8085
    routes:
      - name: pet-public-routes
        paths:
          - /v1/pet-dictionaries
        strip_path: false
      - name: pet-routes
        paths:
          - /v1/pets
        strip_path: false

  - name: health-service
    url: http://health:8088
    routes:
      - name: health-routes
        paths:
          - ~/v1/health/day$
          - ~/v1/pets/.+/health/bootstrap$
          - ~/v1/pets/.+/health/day$
          - ~/v1/pets/.+/scheduled-items$
          - ~/v1/pets/.+/scheduled-items/.+$
          - ~/v1/pets/.+/scheduled-item-occurrences$
          - ~/v1/pets/.+/scheduled-item-occurrences/.+$
          - ~/v1/pets/.+/documents$
          - ~/v1/pets/.+/attachments:init-upload$
          - ~/v1/pets/.+/attachments:confirm-upload$
          - ~/v1/pets/.+/vet-visits$
          - ~/v1/pets/.+/vet-visits/.+$
          - ~/v1/pets/.+/vet-visits/.+/logs$
          - ~/v1/pets/.+/vet-visits/.+/logs/.+$
          - ~/v1/pets/.+/vaccinations$
          - ~/v1/pets/.+/vaccinations/.+$
          - ~/v1/pets/.+/procedures$
          - ~/v1/pets/.+/procedures/.+$
          - ~/v1/pets/.+/medical-records$
          - ~/v1/pets/.+/medical-records/.+$
          - ~/v1/pets/.+/logs/bootstrap$
          - ~/v1/pets/.+/logs$
          - ~/v1/pets/.+/logs/.+$
          - ~/v1/pets/.+/log-types$
          - ~/v1/pets/.+/log-types/.+$
          - ~/v1/pets/.+/metrics$
          - ~/v1/pets/.+/metrics/.+$
          - ~/v1/pets/.+/analytics/metrics$
          - ~/v1/pets/.+/analytics/metrics/.+/series$
        regex_priority: 200
        strip_path: false

  - name: chat-service
    url: http://chat:8089
    routes:
      - name: chat-routes
        paths:
          - /v1/chat
        strip_path: false

  - name: push-service
    url: http://push:8090
    routes:
      - name: push-routes
        paths:
          - /v1/push/devices
          - ~/v1/push/devices/.+$
          - ~/v1/pets/.+/push-settings$
        regex_priority: 200
        strip_path: false

  - name: notification-service
    url: http://notification:8083
    routes:
      - name: notification-routes
        paths:
          - /v1/notifications
        strip_path: false

  - name: email-service
    url: http://email:8084
    routes:
      - name: email-routes
        paths:
          - /internal/v1/email
        strip_path: false

plugins:
  - name: jwt
    route: auth-protected-routes
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: jwt
    route: profile-routes
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: jwt
    route: acl-routes
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: jwt
    route: pet-routes
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: jwt
    route: health-routes
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: jwt
    route: chat-routes
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: jwt
    route: push-routes
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: jwt
    route: notification-routes
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: post-function
    route: auth-protected-routes
    config:
      access:
        - |
          kong.service.request.clear_header("X-User-ID")
          local token = kong.ctx.shared.authenticated_jwt_token
          if type(token) == "string" then
            local payload = token:match("^[^.]+%.([^.]+)%.?[^.]*$")
            if payload then
              payload = payload:gsub("-", "+"):gsub("_", "/")
              local rem = #payload % 4
              if rem == 2 then
                payload = payload .. "=="
              elseif rem == 3 then
                payload = payload .. "="
              elseif rem == 1 then
                payload = nil
              end
            end
            if payload then
              local decoded = ngx.decode_base64(payload)
              if decoded then
                local sub = decoded:match([["sub"%s*:%s*"([^"]+)"]])
                if sub and sub ~= "" then
                  kong.service.request.set_header("X-User-ID", sub)
                end
              end
            end
          end
