_format_version: "3.0"

services:
  - name: auth-service
    url: http://host.docker.internal:8080
    routes:
      - name: auth-public-routes
        paths:
          - ~/auth/register/email$
          - ~/auth/verify/email$
          - ~/auth/login/email$
          - ~/auth/login/oauth$
          - ~/auth/password/reset/request$
          - ~/auth/password/reset/verify$
          - ~/auth/password/reset/confirm$
        strip_path: false
      - name: auth-protected-routes
        paths:
          - ~/auth/logout$
          - ~/auth/logout-all$
          - ~/auth/refresh$
        strip_path: false

  - name: profile-service
    url: http://host.docker.internal:8086
    routes:
      - name: profile-routes
        paths:
          - /v1/profile
        strip_path: false

  - name: acl-service
    url: http://host.docker.internal:8087
    routes:
      - name: acl-routes
        paths:
          - /v1/acl
          - ~/v1/pets/.+/acl
        strip_path: false

  - name: catalog-service
    url: http://host.docker.internal:8082
    routes:
      - name: catalog-routes
        paths:
          - /catalog
        strip_path: false

  - name: pet-service
    url: http://host.docker.internal:8085
    routes:
      - name: pet-routes
        paths:
          - /v1/pets
        strip_path: false

  - name: notification-service
    url: http://host.docker.internal:8083
    routes:
      - name: notification-routes
        paths:
          - /v1/notifications
        strip_path: false

  - name: email-service
    url: http://host.docker.internal:8084
    routes:
      - name: email-routes
        paths:
          - /internal/v1/email
        strip_path: false

plugins:
  - name: jwt
    route: auth-protected-routes
    config:
      key_claim_name: sub
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: jwt
    route: profile-routes
    config:
      key_claim_name: sub
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: jwt
    route: acl-routes
    config:
      key_claim_name: sub
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: jwt
    route: pet-routes
    config:
      key_claim_name: sub
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: jwt
    route: notification-routes
    config:
      key_claim_name: sub
      claims_to_verify:
        - exp
      secret_is_base64: false
  - name: pre-function
    route: auth-protected-routes
    config:
      access:
        - |
          local jwt = ngx.ctx.authenticated_jwt_token
          if jwt and jwt.sub then
            ngx.req.set_header("X-User-ID", jwt.sub)
          end
  - name: pre-function
    route: profile-routes
    config:
      access:
        - |
          local jwt = ngx.ctx.authenticated_jwt_token
          if jwt and jwt.sub then
            ngx.req.set_header("X-User-ID", jwt.sub)
          end
  - name: pre-function
    route: acl-routes
    config:
      access:
        - |
          local jwt = ngx.ctx.authenticated_jwt_token
          if jwt and jwt.sub then
            ngx.req.set_header("X-User-ID", jwt.sub)
          end
  - name: pre-function
    route: pet-routes
    config:
      access:
        - |
          local jwt = ngx.ctx.authenticated_jwt_token
          if jwt and jwt.sub then
            ngx.req.set_header("X-User-ID", jwt.sub)
          end
  - name: pre-function
    route: notification-routes
    config:
      access:
        - |
          local jwt = ngx.ctx.authenticated_jwt_token
          if jwt and jwt.sub then
            ngx.req.set_header("X-User-ID", jwt.sub)
          end

consumers:
  - username: pawly-gateway
    jwt_secrets:
      - key: pawly
        secret: DEFAULT
        algorithm: HS256
