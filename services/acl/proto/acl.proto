syntax = "proto3";

package acl;

option go_package = "acl/proto;aclpb";

enum MembershipStatus {
  MEMBERSHIP_STATUS_UNSPECIFIED = 0;
  MEMBERSHIP_STATUS_ACTIVE = 1;
  MEMBERSHIP_STATUS_REMOVED = 2;
}

enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_PET_READ = 1;
  ACTION_PET_EDIT = 2;
  ACTION_PET_STATUS_CHANGE = 3;
  ACTION_PET_DELETE = 4;
  ACTION_LOG_READ = 5;
  ACTION_LOG_CREATE = 6;
  ACTION_LOG_EDIT = 7;
  ACTION_LOG_DELETE = 8;
  ACTION_LOG_ATTACHMENTS_READ = 9;
  ACTION_HEALTH_READ = 10;
  ACTION_HEALTH_WRITE = 11;
  ACTION_TASK_READ = 12;
  ACTION_TASK_WRITE = 13;
  ACTION_MEMBERS_VIEW = 14;
  ACTION_MEMBERS_INVITE = 15;
  ACTION_MEMBERS_REMOVE = 16;
  ACTION_MEMBERS_EDIT_PERMISSIONS = 17;
}

message Policy {
  bool pet_read = 1;
  bool pet_edit = 2;
  bool pet_status_change = 3;
  bool pet_delete = 4;

  bool log_read = 5;
  bool log_create = 6;
  bool log_edit = 7;
  bool log_delete = 8;
  bool log_attachments_read = 9;

  bool health_read = 10;
  bool health_write = 11;

  bool task_read = 12;
  bool task_write = 13;

  bool members_view = 14;
  bool members_invite = 15;
  bool members_remove = 16;
  bool members_edit_permissions = 17;
}

service ACLService {
  rpc IsMember(IsMemberRequest) returns (IsMemberResponse);
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc Check(CheckRequest) returns (CheckResponse);
  rpc ListPetsForUser(ListPetsForUserRequest) returns (ListPetsForUserResponse);
  rpc CreateOwnerMembership(CreateOwnerMembershipRequest) returns (CreateOwnerMembershipResponse);
}

message IsMemberRequest {
  string pet_id = 1;
  string user_id = 2;
}

message IsMemberResponse {
  bool is_member = 1;
}

message GetPolicyRequest {
  string pet_id = 1;
  string user_id = 2;
}

message GetPolicyResponse {
  string member_id = 1;
  MembershipStatus status = 2;
  bool is_primary_owner = 3;
  Policy policy = 4;
}

message CheckRequest {
  string pet_id = 1;
  string user_id = 2;
  Action action = 3;
}

message CheckResponse {
  bool allowed = 1;
}

message ListPetsForUserRequest {
  string user_id = 1;
}

message ListPetsForUserResponse {
  repeated string pet_ids = 1;
}

message CreateOwnerMembershipRequest {
  string pet_id = 1;
  string user_id = 2;
}

message CreateOwnerMembershipResponse {
  string member_id = 1;
}
