syntax = "proto3";

package profile;

option go_package = "auth/proto/profilepb;profilepb";

service ProfileService {
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
}

message CreateProfileRequest {
  string user_id = 1;
  string locale = 2;
  string first_name = 3;
  string last_name = 4;
}

message CreateProfileResponse {
  string user_id = 1;
}
