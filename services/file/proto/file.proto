syntax = "proto3";

package file;

option go_package = "file/proto;filepb";

import "google/protobuf/timestamp.proto";

service FileService {
  rpc InitUpload(InitUploadRequest) returns (InitUploadResponse);
  rpc ConfirmUpload(ConfirmUploadRequest) returns (ConfirmUploadResponse);
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse);
  rpc BatchGetDownloadUrls(BatchGetDownloadUrlsRequest) returns (BatchGetDownloadUrlsResponse);

  rpc LinkFile(LinkFileRequest) returns (LinkFileResponse);
  rpc UnlinkFile(UnlinkFileRequest) returns (UnlinkFileResponse);
  rpc DeleteFileIfUnlinked(GetFileRequest) returns (GetFileResponse);

  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  rpc ListFileLinks(ListFileLinksRequest) returns (ListFileLinksResponse);
}

enum FileStatus {
  FILE_STATUS_UNSPECIFIED = 0;
  FILE_STATUS_UPLOADING = 1;
  FILE_STATUS_READY = 2;
  FILE_STATUS_PENDING_DELETE = 3;
  FILE_STATUS_DELETED = 4;
}

enum OwnerService {
  OWNER_SERVICE_UNSPECIFIED = 0;
  OWNER_SERVICE_PROFILE = 1;
  OWNER_SERVICE_PET = 2;
  OWNER_SERVICE_GUIDE = 3;
  OWNER_SERVICE_LOG = 4;
  OWNER_SERVICE_HEALTH = 5;
  OWNER_SERVICE_CHAT = 6;
  OWNER_SERVICE_CATALOG = 7;
}

message FileObject {
  string id = 1;
  FileStatus status = 2;
  string mime_type = 3;
  int64 size_bytes = 4;
  string bucket = 5;
  string object_key = 6;
  string created_by_user_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp upload_expires_at = 10;
  string original_filename = 11;
}

message FileLink {
  string id = 1;
  string file_id = 2;
  OwnerService owner_service = 3;
  string owner_type = 4;
  string owner_id = 5;
  string pet_id = 6;
  string created_by_user_id = 7;
  google.protobuf.Timestamp created_at = 8;
}

message UploadInfo {
  string method = 1;
  string url = 2;
  map<string, string> headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message InitUploadRequest {
  string mime_type = 1;
  int64 expected_size_bytes = 2;
  string original_filename = 3;
}

message InitUploadResponse {
  FileObject file = 1;
  UploadInfo upload = 2;
}

message ConfirmUploadRequest {
  string file_id = 1;
  int64 size_bytes = 2;
}

message ConfirmUploadResponse {
  FileObject file = 1;
}

message GetDownloadUrlRequest {
  string file_id = 1;
}

message GetDownloadUrlResponse {
  string file_id = 1;
  string url = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message BatchGetDownloadUrlsRequest {
  repeated string file_ids = 1;
}

message BatchGetDownloadUrlsResponse {
  repeated GetDownloadUrlResponse items = 1;
}

message LinkFileRequest {
  string file_id = 1;
  OwnerService owner_service = 2;
  string owner_type = 3;
  string owner_id = 4;
  string pet_id = 5;
}

message LinkFileResponse {
  FileLink link = 1;
}

message UnlinkFileRequest {
  string file_id = 1;
  OwnerService owner_service = 2;
  string owner_type = 3;
  string owner_id = 4;
}

message UnlinkFileResponse {
  bool deleted = 1;
}

message GetFileRequest {
  string file_id = 1;
}

message GetFileResponse {
  FileObject file = 1;
}

message ListFileLinksRequest {
  string file_id = 1;
}

message ListFileLinksResponse {
  repeated FileLink items = 1;
}
