syntax = "proto3";

package acl;

option go_package = "pawly/pkg/aclpb;aclpb";

enum MembershipStatus {
  MEMBERSHIP_STATUS_UNSPECIFIED = 0;
  MEMBERSHIP_STATUS_ACTIVE = 1;
  MEMBERSHIP_STATUS_REMOVED = 2;
}

enum RoleKind {
  ROLE_KIND_UNSPECIFIED = 0;
  ROLE_KIND_SYSTEM = 1;
  ROLE_KIND_CUSTOM = 2;
}

enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_PET_READ = 1;
  ACTION_PET_WRITE = 2;
  ACTION_LOG_READ = 5;
  ACTION_LOG_WRITE = 6;
  ACTION_HEALTH_READ = 10;
  ACTION_HEALTH_WRITE = 11;
  ACTION_MEMBERS_READ = 14;
  ACTION_MEMBERS_WRITE = 15;
  reserved 12, 13;
}

message Policy {
  bool pet_read = 1;
  bool pet_write = 2;

  bool log_read = 5;
  bool log_write = 6;

  bool health_read = 10;
  bool health_write = 11;

  bool members_read = 14;
  bool members_write = 15;
  reserved 12, 13;
}

message Role {
  string id = 1;
  RoleKind kind = 2;
  string pet_id = 3;
  string code = 4;
  string title = 5;
  string created_by_user_id = 6;
  Policy policy = 7;
}

message PetMembership {
  string pet_id = 1;
  string member_id = 2;
  MembershipStatus status = 3;
  bool is_primary_owner = 4;
  Role role = 5;
  Policy policy = 6;
}

service ACLService {
  rpc IsMember(IsMemberRequest) returns (IsMemberResponse);
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc Check(CheckRequest) returns (CheckResponse);
  rpc ListPetsForUser(ListPetsForUserRequest) returns (ListPetsForUserResponse);
  rpc CreateOwnerMembership(CreateOwnerMembershipRequest) returns (CreateOwnerMembershipResponse);
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);
}

message IsMemberRequest {
  string pet_id = 1;
  string user_id = 2;
}

message IsMemberResponse {
  bool is_member = 1;
}

message GetPolicyRequest {
  string pet_id = 1;
  string user_id = 2;
}

message GetPolicyResponse {
  string member_id = 1;
  MembershipStatus status = 2;
  bool is_primary_owner = 3;
  Policy policy = 4;
}

message CheckRequest {
  string pet_id = 1;
  string user_id = 2;
  Action action = 3;
}

message CheckResponse {
  bool allowed = 1;
}

message ListPetsForUserRequest {
  string user_id = 1;
}

message ListPetsForUserResponse {
  repeated string pet_ids = 1;
  repeated PetMembership memberships = 2;
}

message CreateOwnerMembershipRequest {
  string pet_id = 1;
  string user_id = 2;
}

message CreateOwnerMembershipResponse {
  string member_id = 1;
}

message TransferOwnershipRequest {
  string pet_id = 1;
  string requester_user_id = 2;
  string target_member_id = 3;
}

message TransferOwnershipResponse {
  string previous_owner_member_id = 1;
  string previous_owner_user_id = 2;
  string current_owner_member_id = 3;
  string current_owner_user_id = 4;
}
