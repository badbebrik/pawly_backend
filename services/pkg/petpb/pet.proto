syntax = "proto3";

package pet;

option go_package = "pawly/pkg/petpb;petpb";

service PetService {
  rpc BatchGetBrief(BatchGetBriefRequest) returns (BatchGetBriefResponse);
}

message BatchGetBriefRequest {
  repeated string pet_ids = 1;
}

message PetBrief {
  string pet_id = 1;
  string name = 2;
  string avatar_url = 3;
}

message BatchGetBriefResponse {
  repeated PetBrief items = 1;
  repeated string not_found_pet_ids = 2;
}
